<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Little Learners</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff7e8,#e9f9ff);color:#27324a;user-select:none;overflow-x:hidden}.app{max-width:900px;margin:auto;padding:18px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:28px;font-weight:900;color:#ff7a59}.brand span{font-size:15px;color:#6c7891;display:block}.stars{background:#fff;border:3px solid #ffd166;border-radius:24px;padding:9px 14px;font-weight:900;box-shadow:0 5px 0 #e9c45d}.hero{margin-top:18px;background:linear-gradient(135deg,#ffcf56,#ff8f70);border-radius:30px;padding:22px;color:white;position:relative;overflow:hidden;box-shadow:0 9px 0 #e9b248}.hero h1{font-size:38px;margin:0 0 5px}.hero p{font-size:18px;margin:0;max-width:600px}.sun{position:absolute;right:30px;top:15px;font-size:100px;opacity:.25;animation:float 3s ease-in-out infinite}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:22px}.card{border:0;border-radius:25px;padding:18px;min-height:145px;text-align:left;box-shadow:0 7px 0 rgba(0,0,0,.12);font-size:20px;font-weight:900;cursor:pointer;transition:.15s}.card:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.12)}.card b{font-size:58px;display:block;margin-bottom:4px}.abc{background:#d9f7ff}.num{background:#ffe3ee}.color{background:#e2ffd9}.shape{background:#eee3ff}.animal{background:#fff0c7}.games{background:#dff3ff}.panel{display:none;margin-top:18px;background:#fff;border-radius:28px;padding:20px;box-shadow:0 8px 25px rgba(30,50,80,.12)}.panel.active{display:block}.back{border:0;background:#f0f3f8;border-radius:15px;padding:10px 15px;font-weight:800}.big{font-size:100px;text-align:center;font-weight:900;color:#ff7a59;animation:bounce 1.3s infinite}.sub{text-align:center;font-size:20px;font-weight:800}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.choice{border:0;border-radius:20px;padding:20px;background:#f4f7fb;font-size:38px;font-weight:900;min-height:90px}.choice:active{transform:scale(.96)}.correct{background:#b9f6c3!important}.wrong{background:#ffd0d0!important}.controls{display:flex;gap:10px;justify-content:center;margin-top:15px;flex-wrap:wrap}.controls button{border:0;border-radius:18px;padding:12px 18px;font-weight:900;background:#ffcf56}.pill{display:inline-block;background:#eef4ff;border-radius:20px;padding:8px 12px;font-weight:800}.gamebox{background:linear-gradient(135deg,#e5f9ff,#fff1cf);border-radius:25px;padding:18px;text-align:center;min-height:300px;position:relative;overflow:hidden}.target{font-size:28px;font-weight:900}.bubble{position:absolute;font-size:55px;background:white;border-radius:50%;padding:10px;box-shadow:0 5px 12px #0002;cursor:pointer;animation:float 2s ease-in-out infinite}.footer{text-align:center;color:#7c879c;margin-top:25px;font-size:13px}@keyframes bounce{50%{transform:translateY(-12px)}}@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.card:nth-child(1){grid-column:span 2}.choices{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><div class="top"><div class="brand">🌈 Little Learners<span>Learn • Play • Grow!</span></div><div class="stars">⭐ <span id="score">0</span></div></div>
<div id="home"><div class="hero"><div class="sun">☀️</div><h1>Let's Learn!</h1><p>Tap a world below and have fun learning with sounds, pictures and games.</p></div><div class="grid"><button class="card abc" onclick="show('abc')"><b>🔤</b>ABC World<br><small>Letters & sounds</small></button><button class="card num" onclick="show('numbers')"><b>🔢</b>Number World<br><small>Count & learn</small></button><button class="card color" onclick="show('colors')"><b>🎨</b>Colors<br><small>Find colors</small></button><button class="card shape" onclick="show('shapes')"><b>🔺</b>Shapes<br><small>Circle, square & more</small></button><button class="card animal" onclick="show('animals')"><b>🐶</b>Animal World<br><small>Sounds & names</small></button><button class="card games" onclick="show('games')"><b>🎮</b>Play & Learn<br><small>Fun mini-games</small></button></div></div>
<div id="abc" class="panel"><button class="back" onclick="home()">← Home</button><div class="big" id="letter">A</div><div class="sub" id="letterText">A is for Apple 🍎</div><div class="controls"><button onclick="speakLetter()">🔊 Hear it</button><button onclick="nextLetter()">➡️ Next</button></div></div>
<div id="numbers" class="panel"><button class="back" onclick="home()">← Home</button><div class="big" id="num">1</div><div class="sub" id="numText">One 🍎</div><div class="choices" id="numChoices"></div><div class="controls"><button onclick="speakNum()">🔊 Hear it</button><button onclick="nextNum()">➡️ Next</button></div></div>
<div id="colors" class="panel"><button class="back" onclick="home()">← Home</button><div class="big" id="colorEmoji">🔴</div><div class="sub" id="colorText">RED</div><div class="choices" id="colorChoices"></div></div>
<div id="shapes" class="panel"><button class="back" onclick="home()">← Home</button><div class="big" id="shapeEmoji">⚪</div><div class="sub" id="shapeText">CIRCLE</div><div class="choices" id="shapeChoices"></div></div>
<div id="animals" class="panel"><button class="back" onclick="home()">← Home</button><div class="big" id="animalEmoji">🐶</div><div class="sub" id="animalText">DOG</div><div class="controls"><button onclick="animalSound()">🔊 Animal sound</button><button onclick="nextAnimal()">➡️ Next</button></div></div>
<div id="games" class="panel"><button class="back" onclick="home()">← Home</button><h2 style="text-align:center">🎮 Find the Letter!</h2><div class="gamebox"><div class="target" id="target">Find: A</div><div id="bubbles"></div></div><div class="controls"><button onclick="newGame()">🔄 New Round</button></div></div>
<div class="footer">Made for curious little minds • Works offline</div></div>
<script>
let score=+localStorage.llscore||0;document.getElementById('score').textContent=score;let current=0;const letters=[['A','Apple','🍎'],['B','Ball','⚽'],['C','Cat','🐱'],['D','Dog','🐶'],['E','Elephant','🐘'],['F','Fish','🐟'],['G','Grapes','🍇'],['H','Hat','🎩'],['I','Ice cream','🍦'],['J','Juice','🧃'],['K','Kite','🪁'],['L','Lion','🦁'],['M','Monkey','🐵'],['N','Nest','🪺'],['O','Orange','🍊'],['P','Pencil','✏️'],['Q','Queen','👑'],['R','Rabbit','🐰'],['S','Sun','☀️'],['T','Tiger','🐯'],['U','Umbrella','☂️'],['V','Van','🚐'],['W','Whale','🐳'],['X','Xylophone','🎼'],['Y','Yo-yo','🪀'],['Z','Zebra','🦓']];
const nums=['One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];const animals=[['🐶','DOG','woof woof'],['🐱','CAT','meow'],['🐮','COW','moo'],['🦁','LION','roar'],['🐸','FROG','ribbit'],['🐵','MONKEY','oo oo aa aa'],['🐘','ELEPHANT','trumpet'],['🐑','SHEEP','baa']];const colors=[['🔴','RED'],['🔵','BLUE'],['🟡','YELLOW'],['🟢','GREEN'],['🟣','PURPLE'],['🟠','ORANGE']];const shapes=[['⚪','CIRCLE'],['🟥','SQUARE'],['🔺','TRIANGLE'],['⭐','STAR'],['❤️','HEART']];
function show(id){document.getElementById('home').style.display='none';document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='numbers')renderNum();if(id==='colors')renderColors();if(id==='shapes')renderShapes();if(id==='games')newGame();speak('Welcome to '+id)}function home(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById('home').style.display='block'}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.82;u.pitch=1.15;speechSynthesis.speak(u)}}function add(){score++;localStorage.llscore=score;document.getElementById('score').textContent=score;beep(880,.12)}function beep(f,d){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();o.stop(a.currentTime+d)}catch(e){}}
function renderLetter(){let x=letters[current];document.getElementById('letter').textContent=x[0];document.getElementById('letterText').textContent=x[0]+' is for '+x[1]+' '+x[2]}function nextLetter(){current=(current+1)%26;renderLetter();speakLetter()}function speakLetter(){let x=letters[current];speak(x[0]+'. '+x[0]+' is for '+x[1])}renderLetter();
let ni=0;function renderNum(){document.getElementById('num').textContent=ni+1;document.getElementById('numText').textContent=nums[ni]+' 🔢';let a=[ni+1,Math.max(1,ni),Math.min(10,ni+2),Math.floor(Math.random()*9)+1].sort(()=>Math.random()-.5);document.getElementById('numChoices').innerHTML=a.map(n=>`<button class="choice" onclick="checkNum(this,${n})">${n}</button>`).join('')}function checkNum(b,n){if(n===ni+1){b.classList.add('correct');add();speak('Excellent! '+n);setTimeout(nextNum,500)}else{b.classList.add('wrong');beep(180,.15);speak('Try again')}}function nextNum(){ni=(ni+1)%10;renderNum();speakNum()}function speakNum(){speak((ni+1)+'. '+nums[ni])}
let ci=0;function renderColors(){let x=colors[ci];document.getElementById('colorEmoji').textContent=x[0];document.getElementById('colorText').textContent=x[1];document.getElementById('colorChoices').innerHTML=colors.map(c=>`<button class="choice" onclick="checkColor('${c[1]}')">${c[0]}<br><small>${c[1]}</small></button>`).join('')}function checkColor(c){if(c===colors[ci][1]){add();speak('Great! '+c);ci=(ci+1)%colors.length;setTimeout(renderColors,500)}else speak('Try again')}renderColors();
let si=0;function renderShapes(){let x=shapes[si];document.getElementById('shapeEmoji').textContent=x[0];document.getElementById('shapeText').textContent=x[1];document.getElementById('shapeChoices').innerHTML=shapes.map(c=>`<button class="choice" onclick="checkShape('${c[1]}')">${c[0]}<br><small>${c[1]}</small></button>`).join('')}function checkShape(c){if(c===shapes[si][1]){add();speak('Wonderful! '+c);si=(si+1)%shapes.length;setTimeout(renderShapes,500)}else speak('Try again')}renderShapes();
let ai=0;function renderAnimal(){let x=animals[ai];document.getElementById('animalEmoji').textContent=x[0];document.getElementById('animalText').textContent=x[1]}function nextAnimal(){ai=(ai+1)%animals.length;renderAnimal();animalSound()}function animalSound(){let x=animals[ai];speak(x[1]+'. '+x[2])}renderAnimal();
function newGame(){let target=letters[Math.floor(Math.random()*26)][0];document.getElementById('target').textContent='Find: '+target;let vals=[target];while(vals.length<6){let q=letters[Math.floor(Math.random()*26)][0];if(!vals.includes(q))vals.push(q)}vals.sort(()=>Math.random()-.5);let box=document.getElementById('bubbles');box.innerHTML='';vals.forEach(v=>{let e=document.createElement('button');e.className='bubble';e.textContent=v;e.style.left=(8+Math.random()*75)+'%';e.style.top=(70+Math.random()*120)+'px';e.onclick=()=>{if(v===target){e.classList.add('correct');add();speak('Fantastic! You found '+v);setTimeout(newGame,650)}else{e.classList.add('wrong');speak('Not that one. Try again!')}};box.appendChild(e)})}
</script></body></html>
